<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How edhec-mcp works</title>
<desc id="d">Claude talks to the local edhec-mcp server over stdio. The server checks every request in a safety layer, then uses a private Chrome profile with your own SSO session to reach the four EDHEC services.</desc>
<style>.flow{animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker></defs>
<rect width="1100" height="430" rx="22" fill="#f8fafc"/>
<g>
    <rect x="30" y="140" width="190" height="120" rx="14" fill="#fff" stroke="#d97757" stroke-width="2" />
    <text x="48" y="170" fill="#d97757" font-size="15" font-weight="800">Claude</text>
    <text x="48" y="196" fill="#0f172a" font-size="13.5">Desktop · Code · any</text><text x="48" y="218" fill="#0f172a" font-size="13.5">MCP client</text><text x="48" y="240" fill="#0f172a" font-size="13.5">you approve writes</text>
  </g>
<path d="M222 200 L288 200" stroke="#475569" stroke-width="2" class="flow" stroke-dasharray="5 6" marker-end="url(#ah)"/><text x="255" y="190" text-anchor="middle" fill="#475569" font-size="12">stdio</text>
<g>
    <rect x="292" y="40" width="330" height="350" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2" />
    <text x="310" y="70" fill="#0f172a" font-size="15" font-weight="800">edhec-mcp (runs on your Mac/PC)</text>
    <text x="310" y="96" fill="#0f172a" font-size="13.5">Tools: read · download · print · order (beta)</text><text x="310" y="118" fill="#0f172a" font-size="13.5"></text><text x="310" y="140" fill="#0f172a" font-size="13.5">Safety layer</text><text x="310" y="162" fill="#0f172a" font-size="13.5">• secrets redacted from every result</text><text x="310" y="184" fill="#0f172a" font-size="13.5">• downloads only into safe folders</text><text x="310" y="206" fill="#0f172a" font-size="13.5">• prints only documents, no secrets</text><text x="310" y="228" fill="#0f172a" font-size="13.5">• orders need a one-time confirmation</text><text x="310" y="250" fill="#0f172a" font-size="13.5">• only EDHEC hosts are contacted</text><text x="310" y="272" fill="#0f172a" font-size="13.5"></text><text x="310" y="294" fill="#0f172a" font-size="13.5">Private Chrome profile</text><text x="310" y="316" fill="#0f172a" font-size="13.5">~/.edhec-mcp (your SSO session)</text>
  </g>
<path d="M624 215 L700 215" stroke="#475569" stroke-width="2" class="flow" stroke-dasharray="5 6" marker-end="url(#ah)"/><text x="662" y="205" text-anchor="middle" fill="#475569" font-size="12">HTTPS</text>
<g>
    <rect x="704" y="34" width="366" height="78" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" />
    <text x="722" y="64" fill="#2563eb" font-size="15" font-weight="800">Blackboard Learn</text>
    <text x="722" y="90" fill="#0f172a" font-size="13.5">REST API (read-only)</text>
  </g>
<g>
    <rect x="704" y="126" width="366" height="78" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2" />
    <text x="722" y="156" fill="#7c3aed" font-size="15" font-weight="800">Aurion</text>
    <text x="722" y="182" fill="#0f172a" font-size="13.5">JSF pages (read-only)</text>
  </g>
<g>
    <rect x="704" y="218" width="366" height="78" rx="14" fill="#fff" stroke="#059669" stroke-width="2" />
    <text x="722" y="248" fill="#059669" font-size="15" font-weight="800">PaperCut ePrinting</text>
    <text x="722" y="274" fill="#0f172a" font-size="13.5">Web Print pages</text>
  </g>
<g>
    <rect x="704" y="310" width="366" height="78" rx="14" fill="#fff" stroke="#ea580c" stroke-width="2" />
    <text x="722" y="340" fill="#ea580c" font-size="15" font-weight="800">ALL La Catho · MONEWEB</text>
    <text x="722" y="366" fill="#0f172a" font-size="13.5">menu PDF + JSON API</text>
  </g>
</svg>